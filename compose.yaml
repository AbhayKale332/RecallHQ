services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recallhq
      POSTGRES_USER: recallhq
      POSTGRES_PASSWORD: recallhq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallhq -d recallhq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
