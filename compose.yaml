services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recallhq
      POSTGRES_USER: recallhq
      POSTGRES_PASSWORD: recallhq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallhq -d recallhq"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["slack"]
    build: .
    environment:
      DATABASE_URL: postgresql://recallhq:recallhq@db:5432/recallhq
      DATABASE_WRITE_URL: postgresql://recallhq:recallhq@db:5432/recallhq
    env_file:
      - .env
      - .env.slack
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  slack-worker:
    profiles: ["slack"]
    build: .
    command: ["python", "-m", "recallhq.cli", "slack-worker"]
    environment:
      DATABASE_URL: postgresql://recallhq:recallhq@db:5432/recallhq
      DATABASE_WRITE_URL: postgresql://recallhq:recallhq@db:5432/recallhq
    env_file:
      - .env
      - .env.slack
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
