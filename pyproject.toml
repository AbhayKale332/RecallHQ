[project]
name = "recallhq"
version = "0.1.0"
description = "Search and answer over synthetic team chat"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "openai>=3.26.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recallhq"]
