title: "Beacon: six weeks to a campus event check-in pilot"
timezone: Asia/Kolkata
period:
  start: 2026-08-24
  end: 2026-10-02
  weekdays_only: true
  target_messages_per_channel_day: 12-16
premise: >
  Six students are building Beacon, a small event check-in and attendance dashboard
  for a university entrepreneurship cell. The first pilot is a campus demo on
  2026-10-02. They chat across three Slack-style work channels and two Discord-style
  community channels. The team changes its mind several times as the pilot nears.
personas:
  - id: priya
    name: Priya Shah
    role: tech lead
    style: Clear, calm, writes decisions with reasons and asks for explicit owners.
  - id: arjun
    name: Arjun Rao
    role: backend engineer
    style: Terse, lower-case, short status updates and quick acknowledgments.
  - id: meera
    name: Meera Iyer
    role: product lead
    style: Precise, uses checklists, dates, acceptance criteria, and meeting recaps.
  - id: zoya
    name: Zoya Khan
    role: pilot coordinator
    style: Natural Hinglish in Latin script; owns campus logistics and volunteer training.
  - id: leo
    name: Leo D'Souza
    role: designer
    style: Emoji-heavy, visual language, casual enthusiasm, occasional mockup links.
  - id: nikhil
    name: Nikhil Menon
    role: infrastructure engineer
    style: Pastes exact commands, logs, code fences, and links; explains fixes briefly.
channels:
  - {id: eng, name: eng, platform_style: slack, topic: "Backend, data, deploys, bugs"}
  - {id: product, name: product, platform_style: slack, topic: "Scope, decisions, user feedback"}
  - {id: ops, name: ops, platform_style: slack, topic: "Pilot logistics, owners, deadlines"}
  - {id: build-help, name: build-help, platform_style: discord, topic: "Fast debugging and peer help"}
  - {id: random, name: random, platform_style: discord, topic: "Off-topic talk and lightweight updates"}
filler_topics:
  - classes and exam scheduling
  - cafeteria food, rain, and commute delays
  - CSS spacing, icon choices, and copy edits
  - ordinary standup notes and small refactors
  - jokes, typos, lol, +1, and short acknowledgments
  - harmless example links and occasional code blocks
